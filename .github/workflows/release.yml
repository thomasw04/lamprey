name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build Lamprey
        run: |
          EFI=$(cargo build --bin lamprey --release --locked --message-format=json |
            jq -r '
              select(
                .reason == "compiler-artifact"
                and (.target.kind | index("bin"))
                and .target.name == "lamprey"
                and .executable != null
              )
              | .executable
            ')
          cp "$EFI" lamprey.efi
          sha256sum lamprey.efi > lamprey.efi.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          lamprey.efi
          lamprey.efi.sha256
          --verify-tag
          --generate-notes
